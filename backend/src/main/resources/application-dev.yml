spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/unimanage}
    username: ${DATABASE_USERNAME:unimanage}
    password: ${DATABASE_PASSWORD:}
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
