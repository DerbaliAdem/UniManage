spring:
  datasource:
    url: jdbc:h2:mem:unimanage;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false

app:
  security:
    jwt-secret: 12345678901234567890123456789012
    jwt-issuer: unimanage-test
    jwt-ttl: PT30M
    cors-origin: http://localhost:5173
